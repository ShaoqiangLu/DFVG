model:
  name: "vicuna-7b"
  dtype: "float16"
  tokenizer_path: "tokenizer.model"   # Path to the tokenizer for Vicuna-7B

paths:
  model_dir: "models/vicuna-7b/"
  weights: "models/vicuna-7b/*.bin"   # Sharded weight files for Vicuna-7B

draft_engine:
  enabled: true
  type: "fpga"
  bitstream: "fpga/bitstreams/vicuna7b.bit"
  rpc_addr: "localhost:9000"
  max_draft_tokens: 64                # Number of speculative draft tokens generated by the FPGA per iteration

verify_engine:
  enabled: true
  type: "gpu"
  device: "cuda:0"
  kv_cache_dtype: "fp16"

inference:
  max_seq_len: 4096                   # Maximum sequence length supported for inference
  max_batch_size: 4                   # Maximum batch size per inference step
  temperature: 1.0
  top_p: 0.95
  top_k: 50

scheduler:
  fusion_batch_size: 16               # Maximum number of requests merged into a fused batch
  overlap_compute: true               # Whether to overlap draft and verify computation
  max_pending_tokens: 128             # Maximum pending speculative tokens allowed in the pipeline

tp:
  tensor_parallel_size: 1             # Tensor parallelism degree

logging:
  level: "info"
  dump_traces: false                  # Whether to export detailed execution traces
