model:
  name: "llama-160m"
  dtype: "float16"
  tokenizer_path: "tokenizer.model"   # Tokenizer for LLaMA-160M

paths:
  model_dir: "models/llama-160m/"
  weights: "models/llama-160m/*.bin"

draft_engine:
  enabled: true
  type: "fpga"
  bitstream: "fpga/bitstreams/llama-160m.bit"
  rpc_addr: "localhost:9101"
  max_draft_tokens: 32                # Ideal speculative window for small LLaMA draft

verify_engine:
  enabled: true
  type: "gpu"
  device: "cuda:0"
  kv_cache_dtype: "fp16"

inference:
  max_seq_len: 2048
  max_batch_size: 8
  temperature: 1.0
  top_p: 0.9
  top_k: 50

scheduler:
  fusion_batch_size: 16
  overlap_compute: true
  max_pending_tokens: 64

tp:
  tensor_parallel_size: 1

logging:
  level: "info"
  dump_traces: false
